  <style>
    .not-found {
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      row-gap: var(--spacing-24);
      min-height: calc(100vh - var(--page-padding) - var(--page-padding));
      min-height: calc(100dvh - var(--page-padding) - var(--page-padding));
      padding-block-end: var(--spacing-40);
    }

    .not-found .header {
      align-self: start;
      margin-bottom: 0;
    }

    .not-found__content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .not-found__code {
      margin-bottom: var(--spacing-40);
      padding: var(--spacing-8) var(--spacing-16);
      border: 1px solid var(--color-border-secondary);
      border-radius: var(--radius-pill);
      color: var(--color-text-secondary);
      font-size: 1rem;
      font-weight: var(--font-weight-medium);
    }

    @media (min-width: 768px) {
      .not-found {
        padding-block-end: var(--spacing-60);
      }

      .not-found__code {
        font-size: 1.125rem;
      }
    }

    .not-found__content .hero__title {
      margin-bottom: var(--spacing-16);
      text-wrap: balance;
    }

    .not-found__content .hero__description {
      max-width: min(42rem, 100%);
      font-size: var(--font-size-body);
    }

    .not-found__home {
      margin-top: var(--spacing-80);
      padding-inline: var(--spacing-28);
      border-color: transparent;
      color: var(--color-text-primary);
      background: var(--color-bg-small-block);
      text-align: center;
    }

    .not-found__home:hover {
      border-color: transparent;
      background-color: #2d2e2f;
    }
  </style>
